version: '3.8'

services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "5100:5000"
    environment:
      - PORT=5000
  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
      - "5101:5000"
    environment:
      - PORT=5000
  robot:
