  franchise:
    build:
      context: .
      dockerfile: services/franchise/Dockerfile
    ports:
      - "5104:5000"
    environment:
      - PORT=5000
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports:
      - "5105:5000"
    environment:
      - PORT=5000
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
